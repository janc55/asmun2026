version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: asmun_dokploy_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-asmun_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asmun_secure_password}
      POSTGRES_DB: ${DB_NAME:-asmun_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asmun_user} -d ${DB_NAME:-asmun_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asmun-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: asmun_dokploy_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-asmun_user}:${DB_PASSWORD:-asmun_secure_password}@db:5432/${DB_NAME:-asmun_db}?schema=public
      PORT: 4000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-asmun_jwt_access_secret_super_secure_key_2026}
      # Sesión: el access token dura una jornada de trabajo (8 h) y el cliente web
      # lo renueva solo con el refresh token (ventana de 30 días) cuando recibe
      # 401, así que en la práctica no se vuelve a pedir login durante el evento.
      # Ambos valores se pueden sobrescribir desde el panel de Dokploy.
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-8h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-asmun_jwt_refresh_secret_super_secure_key_2026}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminAsmun2026!}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-"Administrador ASMUN"}
      EVENT_NAME: ${EVENT_NAME:-"ASMUN 2026"}
      EVENT_SUBTITLE: ${EVENT_SUBTITLE:-"Colegio Americano de Oruro"}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-America/La_Paz}
    expose:
      - "4000"
    networks:
      - asmun-network
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: asmun_dokploy_web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3000
      NODE_ENV: production
      # Siempre el hostname Docker del servicio `api`, nunca el dominio público.
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    expose:
      - "3000"
    networks:
      - asmun-network
      - dokploy-network

volumes:
  postgres_data:
    name: asmun_postgres_data

networks:
  asmun-network:
    name: asmun_network
    driver: bridge
  dokploy-network:
    external: true
